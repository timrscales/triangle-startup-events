# Registry of grants & programs for Triangle founders.
#
# This file is the source of truth for WHICH programs exist. The weekly
# scraper (find_programs.py) never invents program records — it syncs this
# list to Airtable and hunts each program's current application deadline.
#
# Fields per entry:
#   name          (required) Program name — becomes Airtable "Program Name"
#   org           (required) Hosting organization (fuzzy-linked to Organizations table)
#   url           (required) Canonical program page — becomes "Program URL"
#   hunt_urls     (optional) Extra pages to check for deadlines (announcement/apply pages)
#   type          (required) Accelerator | Incubator | Bootcamp | Competition |
#                            Grant | Fellowship | Recognition | Corporate Program
#   cadence       (required) cyclical (has application windows) | rolling (always open)
#   geo_scope     (required) Triangle-Local | NC-Regional | National | Global
#   cost          (required) Free | Equity Only | Cash Fee | Equity + Cash Fee
#   location_remote (required) In-person | Remote | Hybrid
#   audience      (optional) list; default [All Founders]
#   stage_served  (optional) list from: Idea Stage, Building, Early Traction, Scaling
#   what_you_offer (optional) list from: Funding, Investor access, Mentorship,
#                  Curriculum, Network/community, Customer/pilot access, Workspace/facilities
#   relocation_required (optional) bool, default false — YC only
#   description   (required) 1–2 sentences, third person
#
# To add a program: append an entry and push. To retire one: delete the entry
# (the Airtable record stays; archive it by hand).

