name: Weekly Programs Finder

on:
  schedule:
    - cron: '0 11 * * 0'  # 7:00 AM ET Sundays (UTC-4 in EDT)
  workflow_dispatch:       # Allow manual runs from the Actions tab

permissions:
  contents: read
  actions: write

jobs:
  find-programs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Find and sync programs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: python find_programs.py

      - name: Write Gmail credentials
        run: |
          echo '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > gmail_credentials.json
          echo '${{ secrets.GMAIL_TOKEN_JSON }}' > gmail_token.json

      - name: Check program links
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          GMAIL_CREDENTIALS_FILE: gmail_credentials.json
          GMAIL_TOKEN_FILE: gmail_token.json
        run: python check_links.py --programs-only

      - name: Send approval digest for programs
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          GMAIL_CREDENTIALS_FILE: gmail_credentials.json
          GMAIL_TOKEN_FILE: gmail_token.json
        run: python approval_digest.py --programs-only
